function initializeLidar() {
    // Crear geometría de la esfera outline
    const lidarSphereGeom = new THREE.SphereGeometry(0.8, 64, 32);
    
    // Material del outline
    const lidarOutlineMaterial = new THREE.ShaderMaterial({
        uniforms: { 
            color: { value: new THREE.Color(0x00ff00) }, 
            opacity: { value: 0.8 } 
        },
        vertexShader: outlineShader.vertexShader,
        fragmentShader: outlineShader.fragmentShader,
        transparent: true,
        side: THREE.DoubleSide
    });
    
    // Crear outline
    lidarOutline = new THREE.Mesh(lidarSphereGeom, lidarOutlineMaterial);
    lidarOutline.layers.set(LAYERS.CAR);
    scene.add(lidarOutline);
    
    // Crear geometría de puntos
    const positions = new Float32Array(maxPoints * 3);
    const colors = new Float32Array(maxPoints * 3);
    lidarPoints = new THREE.BufferGeometry();
    lidarPoints.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    lidarPoints.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    
    // Crear nube de puntos
    lidarCloud = new THREE.Points(lidarPoints, new THREE.PointsMaterial({
        size: 0.2, 
        sizeAttenuation: true, 
        vertexColors: true, 
        transparent: true, 
        opacity: 0.9, 
        alphaTest: 0.1
    }));
    lidarCloud.layers.set(LAYERS.CAR); 
    lidarCloud.position.set(0, 0, 0); // CORRECCIÓN: Posición fija en origen mundial
    scene.add(lidarCloud);
}
  
function updateLidar() {
    if (!lidarEnabled) {
        if (lidarOutline) lidarOutline.visible = false;
        if (lidarCloud) lidarCloud.visible = false;
        return;
    }

    if (isMultiCubeMode) {
        if (lidarOutline) lidarOutline.visible = false;
        if (lidarCloud) lidarCloud.visible = false;
        return;
    }

    // Origen del LiDAR: seguir al cubo
    lidarOrigin.copy(cube.position);
    lidarOrigin.y += 1.7; // altura del sensor

    // Activar y mover la esfera outline
    if (lidarOutline) {
        lidarOutline.visible = true;
        lidarOutline.position.copy(lidarOrigin);
    }

    // Activar la nube de puntos y moverla junto con el origen
    if (lidarCloud) {
        lidarCloud.visible = true;
        lidarCloud.position.copy(lidarOrigin);
    }

    // Función para color según t
    function getColorByT(t) {
        let color = new THREE.Color();
        if (t <= 0.35) {
            color.setRGB(0, 1, 0);
        } else if (t <= 0.55) {
            const f = (t - 0.35) / 0.20;
            color.r = 0;
            color.g = 1 - f * 0.5;
            color.b = f;
        } else if (t <= 0.8) {
            const f = (t - 0.55) / 0.25;
            color.r = f;
            color.g = 0.5 + f * 0.5;
            color.b = 1 - f;
        } else {
            const f = (t - 0.8) / 0.2;
            color.r = 1;
            color.g = 1 - f;
            color.b = 0;
        }
        return color;
    }

    const positions = lidarPoints.attributes.position.array;
    const colors = lidarPoints.attributes.color.array;
    pointIndex = 0;
    totalPoints = 0;

    const buildingMeshes = properties.map(property => {
        for (let i = 0; i < property.children.length; i++) {
            if (property.children[i] instanceof THREE.Mesh) return property.children[i];
        }
        return null;
    }).filter(mesh => mesh !== null);

    const objectsToScan = [...buildingMeshes, ...quadrants, streetH, streetV];

    const scale = (Math.sin(clock.elapsedTime * 1.0) * 0.5 + 0.5) * maxRange * 0.3;
    if (lidarOutline) lidarOutline.scale.set(scale, scale, scale);

    // Raycasting 360°
    for (let angle = 0; angle < 360; angle += angleStep * 8) {
        for (let layer = 0; layer < elevationLayers; layer++) {
            const elevation = -60 + (layer * 120 / elevationLayers);
            const elevationRad = (elevation * Math.PI) / 180;

            for (let ray = 0; ray < raysPerLayer; ray++) {
                const currentAngleRad = ((angle + (ray * 360 / raysPerLayer)) * Math.PI) / 180;

                const dir = new THREE.Vector3(
                    Math.cos(elevationRad) * Math.cos(currentAngleRad),
                    Math.sin(elevationRad),
                    Math.cos(elevationRad) * Math.sin(currentAngleRad)
                );

                // Raycaster desde el origen
                lidarRaycaster.set(lidarOrigin, dir.normalize());
                lidarRaycaster.far = scale;

                const intersects = lidarRaycaster.intersectObjects(objectsToScan);
                if (intersects.length > 0) {
                    const p = intersects[0].point;
                    const distance = lidarOrigin.distanceTo(p);

                    if (distance <= scale && pointIndex < maxPoints) {
                        // Guardar posiciones relativas a lidarOrigin
                        positions[pointIndex * 3 + 0] = p.x - lidarOrigin.x;
                        positions[pointIndex * 3 + 1] = p.y - lidarOrigin.y;
                        positions[pointIndex * 3 + 2] = p.z - lidarOrigin.z;

                        const distanceFactor = THREE.MathUtils.clamp(distance / (maxRange * 0.3), 0, 1);
                        const animationFactor = THREE.MathUtils.clamp(distance / scale, 0, 1);
                        const t = THREE.MathUtils.clamp(distanceFactor * 0.7 + animationFactor * 0.3, 0, 1);

                        const color = getColorByT(t);
                        colors[pointIndex * 3 + 0] = color.r;
                        colors[pointIndex * 3 + 1] = color.g;
                        colors[pointIndex * 3 + 2] = color.b;

                        pointIndex++;
                        totalPoints++;
                    }
                }
            }
        }
    }

    for (let i = totalPoints; i < maxPoints; i++) {
        positions[i * 3 + 0] = 0;
        positions[i * 3 + 1] = 0;
        positions[i * 3 + 2] = 0;
        colors[i * 3 + 0] = 0;
        colors[i * 3 + 1] = 0;
        colors[i * 3 + 2] = 0;
    }

    lidarPoints.attributes.position.needsUpdate = true;
    lidarPoints.attributes.color.needsUpdate = true;
    lidarPoints.setDrawRange(0, totalPoints);

    if (lidarCloud) lidarCloud.material.opacity = 1.0;
}

  

function updateHelperSphere() {
    if (!helperSphere) return;
    
    // Obtener la altura actual de la cámara del slider
    const cameraHeightVal = parseFloat(document.getElementById("val-cameraHeight").value);
    
    // Determinar el cubo base según el modo
    let baseCube;
    
    if (isMultiCubeMode) {
        // En modo multicubo: NO hacer nada aquí, se actualizará desde animateMultiCubes()
        return;
    } else {
        // Modo normal: seguir al cubo principal
        baseCube = cube;
    }
    
    // Verificar que baseCube existe y tiene las propiedades necesarias
    if (!baseCube || !baseCube.position || !baseCube.quaternion) {
        console.warn("baseCube no válido en updateHelperSphere");
        return;
    }
    
    // CORRECCIÓN: Calcular posición con desfase local (igual que el auto)
    const localOffset = new THREE.Vector3(0, 0, -0.65);
    localOffset.applyQuaternion(baseCube.quaternion);
    const offsetPosition = new THREE.Vector3().copy(baseCube.position).add(localOffset);
    
    helperSphere.position.set(offsetPosition.x, cameraHeightVal, offsetPosition.z);

    // Actualizar posición del modelo de cámara si existe
    if (cameraModel) {
        cameraModel.position.set(offsetPosition.x, cameraHeightVal, offsetPosition.z);
        
        // Actualizar rotación del modelo
        if (fpsControlsEnabled && mouseControls) {
            cameraModel.rotation.set(mouseControls.rotationX, mouseControls.rotationY, 0);
        } else if (typeof lastValidCameraAngle !== 'undefined') {
            cameraModel.rotation.set(0, lastValidCameraAngle + Math.PI, 0);
        }
    }
    
    // Actualizar también el cilindro conectivo
    updateConnectionCylinder();
}

function updateConnectionCylinder() {
    if (!connectionCylinder || !helperSphere) return;
    
    // En modo multicubo: NO hacer nada aquí, se actualizará desde animateMultiCubes()
    if (isMultiCubeMode) {
        return;
    }
    
    // Modo normal
    let baseCube = cube;
    let baseCubePosition = cube ? cube.position : null;
    
    // Verificar que tenemos las referencias necesarias
    if (!baseCube || !baseCubePosition || !baseCube.quaternion) {
        console.warn("Referencias no válidas en updateConnectionCylinder");
        connectionCylinder.visible = false;
        return;
    }
    
    connectionCylinder.visible = true;
    
    // CORRECCIÓN: Calcular posición con desfase local (igual que el auto)
    const localOffset = new THREE.Vector3(0, 0, -0.65);
    localOffset.applyQuaternion(baseCube.quaternion);
    const offsetPosition = new THREE.Vector3().copy(baseCubePosition).add(localOffset);
    
    const spherePosition = helperSphere.position;
    
    // Calcular la altura del cilindro (diferencia en Y)
    const cylinderHeight = Math.max(spherePosition.y - baseCubePosition.y, 0.1);
    
    // Actualizar la geometría del cilindro
    if (connectionCylinder.geometry) {
        connectionCylinder.geometry.dispose(); // Limpiar la geometría anterior
    }
    connectionCylinder.geometry = new THREE.CylinderGeometry(
        0.04,           // radiusTop
        0.04,           // radiusBottom  
        cylinderHeight, // height
        6              // radialSegments
    );
    
    // Posicionar el cilindro en el punto medio entre el cubo base y la esfera
    connectionCylinder.position.set(
        offsetPosition.x,   
        baseCubePosition.y + cylinderHeight / 2,   // Y en el punto medio
        offsetPosition.z                           // Z con desfase local
    );
}

    const outlineShader = {
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main(){
                vNormal = normalize(normalMatrix*normal);
                vec4 mvPosition = modelViewMatrix*vec4(position,1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix*mvPosition;
            }
        `,
        fragmentShader: `
            uniform vec3 color;
            uniform float opacity;
            varying vec3 vNormal;

    const equirectShader = {
        uniforms: {
            envMap: { value: null },
            rotationMatrix: { value: new THREE.Matrix3() },
            heading: { value: 0.0 },
            pitch: { value: 0.0 },
            roll: { value: 0.0 }
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            precision mediump float;
            varying vec2 vUv;
            uniform samplerCube envMap;
            uniform mat3 rotationMatrix;
            uniform float heading;
            uniform float pitch;
            uniform float roll;
    
            // Constantes precalculadas
            const float PI = 3.14159265359;
            const float TWO_PI = 6.28318530718;
    
            vec3 uvToDir(vec2 uv) {
                // Mantener la fórmula original exacta
                float theta = uv.x * TWO_PI - PI - heading + PI/2.0 + 0.25 * TWO_PI + PI;
                float phi = (1.0 - uv.y) * PI;
    
                // Precalcular sin(phi) que se usa dos veces
                float sinPhi = sin(phi);
                float cosPhi = cos(phi);
                
                // Precalcular sin/cos de theta
                float sinTheta = sin(theta);
                float cosTheta = cos(theta);
    
                float x = sinPhi * sinTheta;
                float y = cosPhi;
                float z = -sinPhi * cosTheta;
                
                vec3 dir = vec3(x, y, z);
                
                // Precalcular sin/cos para las rotaciones
                float cosH = cos(heading);
                float sinH = sin(heading);
                float cosP = cos(pitch);
                float sinP = sin(pitch);
                
                // Optimización: matriz de rotación combinada Y * X
                mat3 combinedRotation = mat3(
                    cosH, sinH * sinP, sinH * cosP,
                    0.0, cosP, -sinP,
                    -sinH, cosH * sinP, cosH * cosP
                );
    
                dir = combinedRotation * dir;
    
                return normalize(dir);
            }
    
            void main() {
                vec3 dir = uvToDir(vUv);
                gl_FragColor = textureCube(envMap, dir);
            }
        `,
    };
    
    const equirectMaterial = new THREE.ShaderMaterial({

function animate() {
    requestAnimationFrame(animate);

    // Actualizar tiempo de animación
    if (!isAnimationPaused) {
        const deltaTime = clock.getDelta();
        accumulatedTime += deltaTime * animationSpeed;
    } else {
        clock.getDelta();
    }

    // Obtener posición y movimiento actual
    const path = paths[activePath](accumulatedTime);
    cube.position.set(path.x, 0.5, path.z);

    // Funciones auxiliares
    enhanceAnimateFunction();
    updateTrailSystem();

    const velocityMagnitude = Math.sqrt(path.dx * path.dx + path.dz * path.dz);

    coordX.textContent = path.x.toFixed(2);
    coordZ.textContent = path.z.toFixed(2);

    // Rotación del cubo
    if (velocityMagnitude > 0.01) {
        if (activePath === "2009") {
            lastValidCameraAngle = Math.PI / 2;
        } else {
            const rawAngle = Math.atan2(path.dx, path.dz);
            const angleDiff = Math.abs(rawAngle - lastValidCameraAngle);
            const normalizedAngleDiff = Math.min(angleDiff, 2 * Math.PI - angleDiff);
            if (normalizedAngleDiff > 0.1) {
                lastValidCameraAngle = rawAngle;
            }
        }
        cube.rotation.set(0, Math.atan2(path.dx, path.dz), 0);
    }

    // Actualizar posición y rotación del auto solo si no es modo multi-cubo
    if (!isMultiCubeMode) {
        if (carModelLoaded && carModel) {
            carModel.position.set(path.x, 0, path.z);

            if (velocityMagnitude > 0.01) {
                carModel.rotation.set(0, Math.atan2(path.dx, path.dz), 0);
            }
        }
    }

    // Actualizar cámara FPS
    fpsCamera.rotation.set(0, lastValidCameraAngle + Math.PI, 0);

    const cameraHeightVal = parseFloat(document.getElementById("val-cameraHeight").value);
    
    // Posición de cámaras según el modo
    if (isMultiCubeMode) {
        fpsCamera.position.set(0, cameraHeightVal, 0);
    } else {
        fpsCamera.position.set(cube.position.x, cameraHeightVal, cube.position.z);
    }

    if (fpsControlsEnabled) {
        fpsCamera.rotation.order = "YXZ";
        fpsCamera.rotation.set(mouseControls.rotationX, mouseControls.rotationY, 0);
    }

    cubeCamera.position.copy(fpsCamera.position);
    cubeCamera.rotation.copy(fpsCamera.rotation);
    cubeCamera.update(equirectRenderer, scene);

    updateHelperSphere();
    updateLidar();
    updateConnectionCylinder();    

    equirectMaterial.uniforms.envMap.value = cubeRenderTarget.texture;
    const fpsHeading = fpsCamera.rotation.y;
    const headingOffset = Math.PI / 2;
    equirectMaterial.uniforms.heading.value = fpsHeading + headingOffset;

    const rotMatrix = new THREE.Matrix3().setFromMatrix4(fpsCamera.matrixWorld);
    equirectMaterial.uniforms.rotationMatrix.value = rotMatrix;

    // Función auxiliar
    function setObjectsVisibilityForCamera(camera, visible) {
        scene.traverse(function(child) {
            if (child.isMesh) {
                if (!camera.layers.test(child.layers)) {
                    if (visible) {
                        if (child.userData.originalVisible !== undefined) {
                            child.visible = child.userData.originalVisible;
                            delete child.userData.originalVisible;
                        }
                    } else {
                        child.userData.originalVisible = child.visible;
                        child.visible = false;
                    }
                }
            }
        });
    }

    const originalLidarCloudVisible = lidarCloud ? lidarCloud.visible : false;

            const cameraX = cube.position.x - Math.sin(moveAngle) * cameraDistance;
            const cameraZ = cube.position.z - Math.cos(moveAngle) * cameraDistance;

            sectionSVGCamera.position.set(cameraX, cameraHeight, cameraZ);

            const lookAtX = cube.position.x + Math.sin(moveAngle) * cameraDistance;
            const lookAtZ = cube.position.z + Math.cos(moveAngle) * cameraDistance;
            sectionSVGCamera.lookAt(lookAtX, cameraHeight, lookAtZ);

            if (sectionClippingPlane) {
                sectionClippingPlane.normal.set(-Math.sin(moveAngle), 0, -Math.cos(moveAngle));
                sectionClippingPlane.constant = -(cube.position.x * sectionClippingPlane.normal.x + cube.position.z * sectionClippingPlane.normal.z);
            }
        }

        scene.traverse(function(child) {
            if (child.isMesh && child.material) {
                if (Array.isArray(child.material)) {
                    child.material.forEach(mat => mat.clippingPlanes = [sectionClippingPlane]);
                } else {
                    child.material.clippingPlanes = [sectionClippingPlane];
                }
            }
        });

        prepareSVGMaterials();
        applySVGMaterials();
        sectionSVGRenderer.render(scene, sectionSVGCamera);
        restoreOriginalMaterials();

        scene.traverse(function(child) {
            if (child.isMesh && child.material) {
                if (Array.isArray(child.material)) {
                    child.material.forEach(mat => mat.clippingPlanes = []);
                } else {
                    child.material.clippingPlanes = [];
                }
            }
        });

        // CORRECCIÓN: Restaurar estado ORIGINAL
        if (lidarOutline) lidarOutline.visible = originalLidarOutlineVisible;
        if (lidarCloud) lidarCloud.visible = originalLidarCloudVisible;
    }

    // IMPORTANTE: Renders principales DESPUÉS de restaurar visibilidad
    mainRenderer.render(scene, mainCamera);
    cameraRenderer.render(scene, fpsCamera);
    equirectRenderer.render(equirectScene, equirectCamera);
}


    // Función para inicializar controles FPS interactivos
    function initializeFPSControls() {
    
        const cameraCanvas = cameraRenderer.domElement;
        const toggleBtn = document.getElementById("toggleFPSControls");
        const minPitch = -Math.PI / 2 + 0.1;
        const maxPitch = Math.PI / 2 - 0.1;
    
        function setGlobalCursor(cursorStyle) {
            if (document.body.style.cursor !== cursorStyle) {
                document.body.style.cursor = cursorStyle;
            }
        }
    
        function onMouseMove(event) {
            if (!mouseControls.isDown) return;
    
            if (!fpsControlsEnabled) {
                mouseControls.rotationY = lastValidCameraAngle + Math.PI;
                mouseControls.rotationX = 0;
                fpsControlsEnabled = true;
                userHasDragged = true;
                if (toggleBtn) {
                    toggleBtn.textContent = "Auto Follow";
                    toggleBtn.style.backgroundColor = "#4d90fe";
                    toggleBtn.style.color = "white";
                }
                updateCameraCursor();
            }
    
            const deltaX = event.clientX - mouseControls.lastX;
            const deltaY = event.clientY - mouseControls.lastY;
            const sensitivity = 0.003;
    
            mouseControls.rotationY -= deltaX * sensitivity;
            mouseControls.rotationX -= deltaY * sensitivity;
            mouseControls.rotationX = Math.max(minPitch, Math.min(maxPitch, mouseControls.rotationX));
    
            mouseControls.lastX = event.clientX;
            mouseControls.lastY = event.clientY;
        }
    
        function onMouseUp() {
            mouseControls.isDown = false;
            updateCameraCursor();
            setGlobalCursor("");
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
        }
    
        cameraCanvas.addEventListener("mousedown", function(event) {
            if (event.button !== 0) return;
    
            mouseControls.isDown = true;
            mouseControls.lastX = event.clientX;
            mouseControls.lastY = event.clientY;
            setGlobalCursor("grabbing");
    
            document.addEventListener("mousemove", onMouseMove);
            document.addEventListener("mouseup", onMouseUp);
    
            event.preventDefault();
        });
    
        updateCameraCursor();
        cameraCanvas.style.userSelect = "none";
    }

    function updateCameraCursor() {
        const cameraCanvas = cameraRenderer.domElement;
        if (fpsControlsEnabled) {
            cameraCanvas.style.cursor = mouseControls.isDown ? "grabbing" : "grab";

    function handleResize() {
        const viewportInfo = calculateRealViewportDimensions();
        
        // Main camera
        const toleranceFactor = 0.746;
        const newAspect = viewportInfo.aspectRatio * toleranceFactor;
        if (Math.abs(mainCamera.aspect - newAspect) > 0.001) {
            mainCamera.aspect = newAspect;
            mainCamera.updateProjectionMatrix();
        }
    
        // Main renderer
        const viewWidth = viewContainer.clientWidth;
        const viewHeight = viewContainer.clientHeight;
        const currentSize = mainRenderer.getSize(new THREE.Vector2());
        if (currentSize.width !== viewWidth || currentSize.height !== viewHeight) {
            mainRenderer.setSize(viewWidth, viewHeight);
        }
    
        // Ajuste de cámara según WORLD_BOUNDS
        if (WORLD_BOUNDS) {
            const newDistance = calculateOptimalCameraDistance(WORLD_BOUNDS, viewportInfo);
            const newTarget = calculateOptimalTargetHeight(WORLD_BOUNDS, viewportInfo);
            const currentDistance = mainCamera.position.distanceTo(new THREE.Vector3(0, 0, 0));
    
            if (Math.abs(currentDistance - newDistance) > 1) {
                mainCamera.position.set(0, newDistance, newDistance);
                controls.target.set(0, newTarget, 0);
                controls.update();
            }
        }
    
        // FPS camera
        let containerWidth = cameraContainer.clientWidth;
        let containerHeight = Math.min(containerWidth * 9 / 16, cameraContainer.clientHeight);
        containerWidth = containerHeight * 16 / 9;
    
        cameraRenderer.setSize(containerWidth, containerHeight);
    
        // Equirectangular
        const width = equirectContainer.clientWidth;
        const height = width / 2;
        equirectRenderer.setSize(width, height);
    
        cameraRenderer.domElement.style.display = "block";
        cameraRenderer.domElement.style.margin = "auto";
    }

    function enhanceKeyboardControls() {
        // Encontrar el event listener existente y extenderlo
        document.addEventListener('keydown', function(event) {
            // Ignorar si el usuario está escribiendo en un input
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                return;
            }
            
            // Atajos específicos del lightbox
            switch(event.key.toLowerCase()) {
                case 'escape':
                    if (lightboxActive) {
                        closeLightbox();
                        event.preventDefault();
                    }
                    break;
                case 'f':
                    switchLightboxView('fps');
                    event.preventDefault();
                    break;
                case 'e':
                    switchLightboxView('equirect');
                    event.preventDefault();
                    break;
                case 'm':
                    switchLightboxView('main');
                    event.preventDefault();
                    break;
                case 't':
                    switchLightboxView('topsvg');
                    event.preventDefault();
                    break;
                case 's':
                    switchLightboxView('sectionsvg');
                    event.preventDefault();
                    break;
            }
        });
    }
    
    function resetControls() {
        sliders.forEach(function (id) {
            const slider = document.getElementById(id);
            const input = document.getElementById("val-" + id);
            const defaultValue = slider.getAttribute("value");

            slider.value = defaultValue;
            input.value = formatSliderValue(id, defaultValue);

            // Solo disparar evento en slider
            slider.dispatchEvent(new Event("input"));
        });

        // Aplicar morfología por defecto
        morphology = 1;
    }

    function initializeLightboxSystem() {
        enhanceKeyboardControls();

        console.log('Sistema de Lightbox inicializado');
        console.log('Atajos de teclado:');
        Object.entries(LIGHTBOX_VIEWS).forEach(([key, view]) => {
            console.log(`  ${view.hotkey.toUpperCase()}: ${view.name}`);
        });
        console.log('  ESC: Cerrar lightbox');
    }            

    const resetBtn = document.getElementById("resetBtn");
    if (resetBtn) {
        resetBtn.addEventListener("click", resetControls);
    }

    // INICIALIZACIÓN
    initializeFPSControls();
    fpsControlsEnabled = false;
    userHasDragged = false;
    const toggleBtn = document.getElementById("toggleFPSControls");
    if (toggleBtn) {
        toggleBtn.textContent = "Auto Follow";
        toggleBtn.style.backgroundColor = "#28a745";
        toggleBtn.style.color = "white";
    }
    handleResize();
    initializeSVGTopView();
    initializeSVGSectionView();
    createSectionClippingPlane();
    animate();
    initializeMultiCubeSystem();
    initializeLightboxSystem();
    loadCarModel();
    generateAllProperties();
    updateDynamicPropertyValues(WORLD_BOUNDS);
</script>
</body>
</html>

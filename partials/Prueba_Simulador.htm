    function loadCameraModel() {
        const loader = new THREE.GLTFLoader();
        loader.load(
            'https://edgarzr54.github.io/StreetData-Insight/Tools/SVCAMERA.glb',
            function(gltf) {
                cameraModel = gltf.scene;
    
                // Aplicar material azul #007BFF y hacer visibles las caras internas
                cameraModel.traverse(function(child) {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({ 
                            color: 0x007BFF, 
                            side: THREE.DoubleSide
                        });
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
    
                // Escalar modelo apropiadamente y centrar
                const box = new THREE.Box3().setFromObject(cameraModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                const scale = 0.4 / Math.max(size.x, size.y, size.z);
                cameraModel.scale.set(scale, scale, scale);
    
                // Crear un grupo contenedor para mejor control
                const cameraGroup = new THREE.Group();
                cameraGroup.add(cameraModel);
    
                // Centrar el modelo dentro del grupo
                cameraModel.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
    
                // Reemplazar la referencia
                cameraModel = cameraGroup;
    
                // Asignar a capa HELPERS
            // Asignar a capa HELPERS tanto el grupo como todos sus hijos
            cameraModel.layers.set(LAYERS.CAR);
            cameraModel.traverse(function(child) {
                child.layers.set(LAYERS.CAR);
            });
            
                // Añadir a la escena
                scene.add(cameraModel);
                console.log("Modelo de cámara cargado, caras internas visibles y añadido a la capa CAR");
            },
            undefined,
            function(error) {
                console.error('Error al cargar el modelo de cámara:', error);
            }
        );
    }

function animateMultiCubes() {

                    }

                    // Guardar path actual para mover el auto
                    currentPath = path;  // ← MANTENER como estaba
                }

        // Los demás cubos permanecen estáticos
    });

if (currentPath && carModelLoaded && carModel) {

    function checkCurrentAnimationComplete() {
        if (currentAnimatingCubeIndex >= SEQUENTIAL_ORDER.length) return;
        
        const year = SEQUENTIAL_ORDER[currentAnimatingCubeIndex];
        const cube = multiCubes[currentAnimatingCubeIndex];
        
        if (!cube || !cube.userData.isAnimating) return;
        
        const startTime = cubeAnimationStartTimes[year] || 0;
        const acceleratedTime = (accumulatedTime - startTime) * sequentialAnimationSpeed;
        
        // Verificar si el cubo ha dejado de moverse (path terminado)
        const currentPos = cube.position;
        const posKey = `${currentPos.x.toFixed(3)},${currentPos.z.toFixed(3)}`;
        
        // Inicializar si es la primera vez
        if (!lastCubePositions[year]) {
            lastCubePositions[year] = posKey;
            stationaryFrameCount[year] = 0;
            return;
        }
        
        // Verificar si la posición cambió significativamente
        const lastPosKey = lastCubePositions[year];
        const hasMovedSignificantly = posKey !== lastPosKey;
        
        if (hasMovedSignificantly) {
            stationaryFrameCount[year] = 0;
            lastCubePositions[year] = posKey;
        } else {
            stationaryFrameCount[year]++;
        }
        
        // Verificar si el path function devuelve valores válidos
        let pathEnded = false;
        if (paths[year] && typeof paths[year] === 'function') {
            const path = paths[year](acceleratedTime);
            
            if (!path || 
                isNaN(path.x) || isNaN(path.z) || 
                !isFinite(path.x) || !isFinite(path.z) ||
                Math.abs(path.x) > 1000 || Math.abs(path.z) > 1000) {
                pathEnded = true;
            }
        }
        
        // Criterios para considerar animación completa
        const minAnimationTime = 2;
        const stationaryThreshold = 60;
        const maxAnimationTime = 30;
        
        const hasMinTime = acceleratedTime >= minAnimationTime;
        const isStationary = stationaryFrameCount[year] >= stationaryThreshold;
        const hasMaxTime = acceleratedTime >= maxAnimationTime;
        
        if ((hasMinTime && (isStationary || pathEnded)) || hasMaxTime) {
            console.log(`Path completado para ${year}:`, {
                time: acceleratedTime.toFixed(2) + 's',
                stationary: isStationary,
                pathEnded: pathEnded,
                maxTime: hasMaxTime
            });
            
            // ✅ CAMBIO PRINCIPAL: Hacer invisible el cubo completado
            cube.userData.isAnimating = false;
            cube.userData.animationComplete = true;
            cube.visible = false; // ✅ OCULTAR en lugar de mantener visible
            
            console.log(`Cubo ${year} ocultado tras completar recorrido`);
            
            // Limpiar datos de tracking
            delete lastCubePositions[year];
            delete stationaryFrameCount[year];
            
            // Avanzar al siguiente cubo
            currentAnimatingCubeIndex++;
            startNextCubeAnimation();
        }
    }

// ===================================================================
// FUNCIONES DE TRAIL
// ===================================================================
    function updateMultiCubeTrailLineAdaptive(year) {
        const trail = multiCubeTrails[year];
        if (!trail || trail.points.length < 2) return;
        
        // Limpiar ribbons anteriores
        trail.lines.forEach(line => {
            scene.remove(line);
            if (line.geometry) line.geometry.dispose();
        });
        trail.lines = [];
        
        // PARÁMETROS AJUSTADOS PARA VELOCIDAD ALTA
        const ribbonWidth = 0.20;
        // Dash más corto para velocidades altas - se adapta a la velocidad
        const dashLength = 0.8 / Math.sqrt(sequentialAnimationSpeed); // Se reduce con velocidad alta
        const gapLength = 0.4 / Math.sqrt(sequentialAnimationSpeed);  // Gap también se reduce
        const curveThreshold = 0.3;
        
        // Mínimos para que no sean demasiado pequeños
        const minDashLength = 0.3;
        const minGapLength = 0.15;
        
        const finalDashLength = Math.max(minDashLength, dashLength);
        const finalGapLength = Math.max(minGapLength, gapLength);
        
        let totalDistance = 0;
        const distances = [0];
        const curvatures = [0];
        
        // Calcular distancias y curvaturas
        for (let i = 1; i < trail.points.length; i++) {
            const distance = trail.points[i-1].distanceTo(trail.points[i]);
            totalDistance += distance;
            distances.push(totalDistance);
            
            let curvature = 0;
            if (i > 1 && i < trail.points.length - 1) {
                const prev = trail.points[i-1];
                const curr = trail.points[i];
                const next = trail.points[i+1];
                
                const vec1 = new THREE.Vector3().subVectors(curr, prev).normalize();
                const vec2 = new THREE.Vector3().subVectors(next, curr).normalize();
                const cross = new THREE.Vector3().crossVectors(vec1, vec2);
                curvature = cross.length();
            }
            curvatures.push(curvature);
        }
        
        // Generar segmentos dashed con longitudes adaptativas
        let currentDistance = 0;
        let segmentStart = 0;
        
        while (currentDistance < totalDistance) {
            const segmentEnd = currentDistance + finalDashLength;
            let startIndex = segmentStart;
            let endIndex = startIndex;
            
            while (endIndex < distances.length - 1 && distances[endIndex] < segmentEnd) {
                endIndex++;
            }
            
            if (endIndex > startIndex) {
                const segmentPoints = trail.points.slice(startIndex, endIndex + 1);
                let maxCurvature = 0;
                
                for (let i = startIndex; i <= endIndex && i < curvatures.length; i++) {
                    maxCurvature = Math.max(maxCurvature, curvatures[i]);
                }
                
                let geometry;
                if (maxCurvature > curveThreshold && segmentPoints.length >= 3) {
                    geometry = createCurvedRibbon(segmentPoints, ribbonWidth);
                } else if (segmentPoints.length >= 2) {
                    geometry = createDashedRibbon(segmentPoints[0], segmentPoints[segmentPoints.length - 1], ribbonWidth);
                }
                
                if (geometry) {
                    const ribbon = new THREE.Mesh(geometry, trail.material);
                    scene.add(ribbon);
                    trail.lines.push(ribbon);
                }
            }
            
            currentDistance = segmentEnd + finalGapLength;
            while (segmentStart < distances.length - 1 && distances[segmentStart] < currentDistance) {
                segmentStart++;
            }
            
            if (segmentStart >= distances.length - 1) break;
        }
    }
    
    function updateMultiCubeTrailSystemAccelerated(year, cubePosition, adjustedSampleRate) {
        if (!isTrailEnabled) return;
    
        const trail = multiCubeTrails[year];
        if (!trail) return;
    
        const currentTime = accumulatedTime;
    
        // ✅ MUESTREO AJUSTADO: Más frecuente para compensar velocidad
        if (currentTime - trail.lastSample >= adjustedSampleRate) {
            const heightOffset = trail.heightOffset;
    
            // Agregar nuevo punto al trail
            trail.points.push(new THREE.Vector3(cubePosition.x, heightOffset, cubePosition.z));
    
            // Actualizar línea solo si hay al menos 2 puntos
            if (trail.points.length >= 2) {
                updateMultiCubeTrailLineAdaptive(year);
            }
    
            trail.lastSample = currentTime;
        }
    }

    function createRibbonMaterial() {
        // Obtener color según el año activo
        const yearColor = ribbonColorsByYear[activePath] || 0xff6b6b; // Color por defecto si no se encuentra
        
        // Material sólido optimizado con color específico del año
        ribbonMaterial = new THREE.MeshBasicMaterial({
            color: yearColor,
            side: THREE.DoubleSide
        });
        return ribbonMaterial;
    }
    
    function createDashedRibbon(startPoint, endPoint, width) {
        const vertices = [];
        const indices = [];
        
        // Calcular dirección y perpendicular
        const direction = new THREE.Vector3().subVectors(endPoint, startPoint).normalize();
        const perpendicular = new THREE.Vector3(-direction.z, 0, direction.x).multiplyScalar(width);
        
        // Crear vértices del ribbon segment
        const p1 = new THREE.Vector3().addVectors(startPoint, perpendicular); // Lado derecho inicio
        const p2 = new THREE.Vector3().subVectors(startPoint, perpendicular); // Lado izquierdo inicio
        const p3 = new THREE.Vector3().addVectors(endPoint, perpendicular);   // Lado derecho final
        const p4 = new THREE.Vector3().subVectors(endPoint, perpendicular);   // Lado izquierdo final
        
        // Agregar vértices
        vertices.push(
            p1.x, p1.y, p1.z,
            p2.x, p2.y, p2.z,
            p3.x, p3.y, p3.z,
            p4.x, p4.y, p4.z
        );
        
        // Índices para dos triángulos
        indices.push(
            0, 1, 2,  // Primer triángulo
            1, 3, 2   // Segundo triángulo
        );
        
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        
        return geometry;
    }
    
    function createCurvedRibbon(points, width) {
        if (points.length < 3) return null;
        
        const vertices = [];
        const indices = [];
        
        // Crear ribbon curvo suavizado
        for (let i = 0; i < points.length - 1; i++) {
            const current = points[i];
            const next = points[i + 1];
            
            // Calcular dirección suavizada usando puntos adyacentes
            let direction;
            if (i === 0) {
                // Primera sección
                direction = new THREE.Vector3().subVectors(next, current).normalize();
            } else if (i === points.length - 2) {
                // Última sección
                direction = new THREE.Vector3().subVectors(next, current).normalize();
            } else {
                // Sección intermedia - promedio de direcciones
                const prev = points[i - 1];
                const nextNext = points[i + 2];
                const dir1 = new THREE.Vector3().subVectors(current, prev).normalize();
                const dir2 = new THREE.Vector3().subVectors(next, current).normalize();
                const dir3 = new THREE.Vector3().subVectors(nextNext, next).normalize();
                
                direction = new THREE.Vector3().addVectors(dir1, dir2).add(dir3).normalize();
            }
            
            const perpendicular = new THREE.Vector3(-direction.z, 0, direction.x).multiplyScalar(width);
            
            const p1 = new THREE.Vector3().addVectors(current, perpendicular);
            const p2 = new THREE.Vector3().subVectors(current, perpendicular);
            const p3 = new THREE.Vector3().addVectors(next, perpendicular);
            const p4 = new THREE.Vector3().subVectors(next, perpendicular);
            
            const baseIndex = i * 4;
            
            vertices.push(
                p1.x, p1.y, p1.z,
                p2.x, p2.y, p2.z,
                p3.x, p3.y, p3.z,
                p4.x, p4.y, p4.z
            );
            
            indices.push(
                baseIndex, baseIndex + 1, baseIndex + 2,
                baseIndex + 1, baseIndex + 3, baseIndex + 2
            );
        }
        
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        
        return geometry;
    }
    
    function updateTrailLine() {
        console.log("updateTrailLine llamado, puntos:", trailPoints.length);
        
        if (trailPoints.length < 2) {
            console.log("No hay suficientes puntos para crear ribbons");
            return;
        }
        
        // Limpiar ribbons anteriores
        if (trailLines.length > 0) {
            console.log("Limpiando", trailLines.length, "ribbons anteriores");
            trailLines.forEach(function(line) {
                scene.remove(line);
                if (line.geometry) line.geometry.dispose();
            });
            trailLines = [];
        }
        
        const ribbonWidth = 0.25;
        const dashLength = 1.5;    // Longitud de cada segmento de ribbon
        const gapLength = 0.8;     // Separación entre ribbons
        const curveThreshold = 0.3; // Umbral para detectar curvas
        
        // Crear material si no existe
        if (!ribbonMaterial) {
            createRibbonMaterial(); // Esto ahora usa el color del año
        } else {
            // Si ya existe material, actualizar su color al año actual
            const yearColor = ribbonColorsByYear[activePath] || 0xff6b6b;
            ribbonMaterial.color.setHex(yearColor);
            console.log("Material actualizado para año", activePath, "con color:", "#" + yearColor.toString(16).toUpperCase());
        }
        
        let totalDistance = 0;
        const distances = [0];
        const curvatures = [0];
        
        
        // Calcular distancias y curvaturas
        for (let i = 1; i < trailPoints.length; i++) {
            const distance = trailPoints[i-1].distanceTo(trailPoints[i]);
            totalDistance += distance;
            distances.push(totalDistance);
            
            // Calcular curvatura
            let curvature = 0;
            if (i > 1 && i < trailPoints.length - 1) {
                const prev = trailPoints[i-1];
                const curr = trailPoints[i];
                const next = trailPoints[i+1];
                
                const vec1 = new THREE.Vector3().subVectors(curr, prev).normalize();
                const vec2 = new THREE.Vector3().subVectors(next, curr).normalize();
                
                const cross = new THREE.Vector3().crossVectors(vec1, vec2);
                curvature = cross.length();
            }
            curvatures.push(curvature);
        }
        
        // Generar segmentos dashed
        let currentDistance = 0;
        let segmentStart = 0;
        
        while (currentDistance < totalDistance) {
            // Encontrar puntos para el siguiente segmento
            const segmentEnd = currentDistance + dashLength;
            
            // Encontrar índices de puntos para este segmento
            let startIndex = segmentStart;
            let endIndex = startIndex;
            
            // Buscar punto final del segmento
            while (endIndex < distances.length - 1 && distances[endIndex] < segmentEnd) {
                endIndex++;
            }
            
            if (endIndex > startIndex) {
                // Extraer puntos del segmento
                const segmentPoints = trailPoints.slice(startIndex, endIndex + 1);
                
                // Determinar si el segmento es curvo
                let maxCurvature = 0;
                for (let i = startIndex; i <= endIndex && i < curvatures.length; i++) {
                    maxCurvature = Math.max(maxCurvature, curvatures[i]);
                }
                
                let geometry;
                if (maxCurvature > curveThreshold && segmentPoints.length >= 3) {
                    // Crear ribbon curvo
                    geometry = createCurvedRibbon(segmentPoints, ribbonWidth);
                } else if (segmentPoints.length >= 2) {
                    // Crear ribbon recto
                    geometry = createDashedRibbon(segmentPoints[0], segmentPoints[segmentPoints.length - 1], ribbonWidth);
                }
                
                if (geometry) {
                    const ribbon = new THREE.Mesh(geometry, ribbonMaterial);
                    scene.add(ribbon);
                    trailLines.push(ribbon);
                }
            }
            
            // Avanzar al siguiente segmento (con gap)
            currentDistance = segmentEnd + gapLength;
            
            // Actualizar índice de inicio para el próximo segmento
            while (segmentStart < distances.length - 1 && distances[segmentStart] < currentDistance) {
                segmentStart++;
            }
            
            // Prevenir bucle infinito
            if (segmentStart >= distances.length - 1) break;
        }
        
        console.log("Ribbons segmentados creados para año", activePath + ":", trailLines.length, "segmentos");
    }

        if (!renderer || !originalContainer) {

        // GUARDAR DIMENSIONES Y ESTILOS - optimizado
        const currentStyles = rendererElement.style;
        rendererElement.originalStyles = {
            width: currentStyles.width,
            height: currentStyles.height,
            maxWidth: currentStyles.maxWidth,
            maxHeight: currentStyles.maxHeight,
            position: currentStyles.position,
            display: currentStyles.display,
            margin: currentStyles.margin,
            actualWidth: rendererElement.width || renderer.getSize().x,
            actualHeight: rendererElement.height || renderer.getSize().y
        };
    
        // Usar viewport cacheado
        const viewport = getCachedViewportDimensions();
        const maxWidth = viewport.width * 0.9;
        const maxHeight = viewport.height * 0.8;
    
        // Calcular nuevo tamaño usando switch optimizado
        let newWidth, newHeight;
        
        switch(viewKey) {
            case 'equirect':
                if (maxWidth / EQUIRECT_RATIO <= maxHeight) {
                    newWidth = maxWidth;
                    newHeight = maxWidth / EQUIRECT_RATIO;
                } else {
                    newHeight = maxHeight;
                    newWidth = maxHeight * EQUIRECT_RATIO;
                }
                break;
                
            case 'fps':
                if (maxWidth / FPS_RATIO <= maxHeight) {
                    newWidth = maxWidth;
                    newHeight = maxWidth / FPS_RATIO;
                } else {
                    newHeight = maxHeight;
                    newWidth = maxHeight * FPS_RATIO;
                }
                break;
                
            case 'topsvg':
            case 'sectionsvg':
                const scale = Math.min(maxWidth / 300, maxHeight / 300);
                newWidth = newHeight = 300 * scale;
                break;
        }
    
        // Batch DOM updates para mejor performance
        const styleUpdates = {
            width: `${newWidth}px`,
            height: `${newHeight}px`,
            maxWidth: 'none',
            maxHeight: 'none',
            position: 'static',
            display: 'block',
            margin: '0'
        };
        
        Object.assign(rendererElement.style, styleUpdates);
    
        // Redimensionar renderer - optimizado con checks
        const isSVG = viewKey === 'topsvg' || viewKey === 'sectionsvg';
        if (renderer.setSize && !isSVG) {
            renderer.setSize(newWidth, newHeight);
            
            const camera = view.camera();
            if (camera && camera.isPerspectiveCamera) {
                const aspectRatio = viewKey === 'equirect' ? EQUIRECT_RATIO : 
                                  viewKey === 'fps' ? FPS_RATIO : 
                                  newWidth / newHeight;
                
                if (camera.aspect !== aspectRatio) {
                    camera.aspect = aspectRatio;
                    camera.updateProjectionMatrix();
                }
            }
        }
    
        // Usar elemento cacheado
        lightboxViewContainer.appendChild(rendererElement);
        lightboxContainer.style.display = 'flex';

    function downloadWebGLView(renderer, filename) {
        try {
            console.log(`Iniciando descarga WebGL: ${filename}`);
            
            const canvas = renderer.domElement;
            
            // Check WebGL context una sola vez
            const context = canvas.getContext('webgl') || canvas.getContext('webgl2') || canvas.getContext('experimental-webgl');
            if (!context) {
                throw new Error('No se pudo obtener el contexto WebGL');
            }
            
            // Optimizar renders según tipo
            switch(renderer) {
                case cameraRenderer:
                    renderer.render(scene, fpsCamera);
                    break;
                    
                case equirectRenderer:
                    cubeCamera.position.copy(fpsCamera.position);
                    cubeCamera.rotation.copy(fpsCamera.rotation);
                    cubeCamera.update(renderer, scene);
                    
                    // Batch uniform updates
                    const uniforms = equirectMaterial.uniforms;
                    uniforms.envMap.value = cubeRenderTarget.texture;
                    
                    const fpsHeading = fpsCamera.rotation.y;
                    uniforms.heading.value = fpsHeading + Math.PI / 2;
                    
                    const rotMatrix = new THREE.Matrix3().setFromMatrix4(fpsCamera.matrixWorld);
                    uniforms.rotationMatrix.value = rotMatrix;
                    
                    renderer.render(equirectScene, equirectCamera);
                    break;
                    
                case mainRenderer:
                    renderer.render(scene, mainCamera);
                    break;
            }
            
            const width = canvas.width;
            const height = canvas.height;
            const pixelCount = width * height * 4;
            
            // Pre-allocate arrays
            const downloadCanvas = document.createElement('canvas');
            downloadCanvas.width = width;
            downloadCanvas.height = height;
            const downloadContext = downloadCanvas.getContext('2d');
            
            const pixels = new Uint8Array(pixelCount);
            context.readPixels(0, 0, width, height, context.RGBA, context.UNSIGNED_BYTE, pixels);
            
            const imageData = downloadContext.createImageData(width, height);
            
            // Optimizar loop de volteo de imagen
            const data = imageData.data;
            for (let y = 0; y < height; y++) {
                const srcRowStart = y * width * 4;
                const dstRowStart = (height - 1 - y) * width * 4;
                
                for (let x = 0; x < width; x++) {
                    const srcIndex = srcRowStart + x * 4;
                    const dstIndex = dstRowStart + x * 4;
                    
                    data[dstIndex] = pixels[srcIndex];
                    data[dstIndex + 1] = pixels[srcIndex + 1];
                    data[dstIndex + 2] = pixels[srcIndex + 2];
                    data[dstIndex + 3] = pixels[srcIndex + 3];
                }
            }
            
            downloadContext.putImageData(imageData, 0, 0);
            
            // Usar toBlob con callback optimizado
            downloadCanvas.toBlob(function(blob) {
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = url;
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // Cleanup con timeout reducido
                    setTimeout(() => URL.revokeObjectURL(url), 50);
                    
                    console.log(`✅ Descarga WebGL completada: ${filename}`);
                } else {
                    throw new Error('No se pudo generar el blob de la imagen');
                }
            }, 'image/png', 0.95);
            
        } catch (error) {
            console.error('Error al descargar imagen WebGL:', error);
        }
    }
    
    function downloadSVGView(svgRenderer, filename) {
        try {
            const svgElement = svgRenderer.domElement;
            
            if (!svgElement || svgElement.tagName.toLowerCase() !== 'svg') {
                throw new Error('Elemento SVG no encontrado');
            }
            
            const svgClone = svgElement.cloneNode(true);
            
            // Batch crear elementos de metadatos
            const fragment = document.createDocumentFragment();
            
            const metadataGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            metadataGroup.setAttribute('id', 'metadata');
            metadataGroup.style.display = 'none';
            
            const titleElement = document.createElementNS('http://www.w3.org/2000/svg', 'title');
            titleElement.textContent = `${currentLightboxView.toUpperCase()} View - Year: ${activePath}`;
            
            const descElement = document.createElementNS('http://www.w3.org/2000/svg', 'desc');
            descElement.textContent = `Generated on ${new Date().toLocaleString()} from Three.js 3D visualization`;
            
            metadataGroup.appendChild(titleElement);
            metadataGroup.appendChild(descElement);
            svgClone.insertBefore(metadataGroup, svgClone.firstChild);
            
            // Batch attribute updates
            const attributes = {
                width: svgElement.clientWidth || 300,
                height: svgElement.clientHeight || 300,
                xmlns: 'http://www.w3.org/2000/svg'
            };
            
            Object.entries(attributes).forEach(([attr, value]) => {
                if (!svgClone.getAttribute(attr)) {
                    svgClone.setAttribute(attr, value);
                }
            });
            
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgClone);
            
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.download = filename;
            link.href = url;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            setTimeout(() => URL.revokeObjectURL(url), 50);
            
            console.log(`✅ Descarga SVG iniciada: ${filename}`);
    
        } catch (error) {
            console.error('Error al descargar SVG:', error);
        }
    }
    
    function closeLightbox() {
        if (!lightboxActive || !currentLightboxView) return;
    
        const view = LIGHTBOX_VIEWS[currentLightboxView];
        const renderer = view.renderer();
        const rendererElement = renderer.domElement;
    
        // Restaurar estilos originales en batch
        if (rendererElement.originalStyles) {
            Object.assign(rendererElement.style, rendererElement.originalStyles);
            delete rendererElement.originalStyles;
        }
    
        originalParent.appendChild(rendererElement);
    
        const isSVG = currentLightboxView === 'topsvg' || currentLightboxView === 'sectionsvg';
        if (renderer.setSize && !isSVG) {
            const container = originalParent;
            let containerWidth, containerHeight;
            
            if (currentLightboxView === 'fps') {
                containerWidth = container.clientWidth;
                containerHeight = (containerWidth * 9) / 16;
                
                if (containerHeight > container.clientHeight) {
                    containerHeight = container.clientHeight;
                    containerWidth = (containerHeight * 16) / 9;
                }
                
                const camera = view.camera();
                if (camera && camera.isPerspectiveCamera && camera.aspect !== FPS_RATIO) {
                    camera.aspect = FPS_RATIO;
                    camera.updateProjectionMatrix();
                }
                
                renderer.setSize(containerWidth, containerHeight);
                Object.assign(rendererElement.style, {
                    display: "block",
                    margin: "auto"
                });
                
            } else if (currentLightboxView === 'equirect') {
                const width = container.clientWidth;
                const height = width / 2;
                
                renderer.setSize(width, height);
                
                const camera = view.camera();
                if (camera && camera.isPerspectiveCamera && camera.aspect !== EQUIRECT_RATIO) {
                    camera.aspect = EQUIRECT_RATIO;
                    camera.updateProjectionMatrix();
                }
            }
        }
    
        // Batch style updates
        lightboxContainer.style.display = 'none';
        document.body.style.overflow = '';
    
        lightboxActive = false;
        currentLightboxView = null;
        originalParent = null;
    
        console.log('Lightbox cerrado - Dimensiones restauradas');
    }
    
    function switchLightboxView(viewKey) {
        if (lightboxActive && currentLightboxView === viewKey) {

    mainCamera.layers.set(LAYERS.DEFAULT);

    function setupFrustumCulling(camera, scene) {
        const frustum = new THREE.Frustum();
        const cameraMatrix = new THREE.Matrix4();
        
        return function updateFrustumCulling() {
            // Actualizar frustum con la posición actual de la cámara
            cameraMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(cameraMatrix);
            
            // Aplicar culling a todos los objetos
            scene.traverse((object) => {
                if (object.isMesh && object.geometry) {
                    // Calcular bounding sphere si no existe
                    if (!object.geometry.boundingSphere) {
                        object.geometry.computeBoundingSphere();
                    }
                    
                    // Test de frustum culling
                    const sphere = object.geometry.boundingSphere.clone();
                    sphere.applyMatrix4(object.matrixWorld);
                    
                    object.visible = frustum.intersectsSphere(sphere);
                }
            });
        };
    }

    // Función para calcular densidad basada en morphology slider
    function getDynamicBuildingDensity() {
        const variability = (morphology - 1) / 9;
        
        // Factor de compensación por tamaño del mundo
        const worldScale = WORLD_BOUNDS / 50; // Normalizar respecto a tamaño medio (50)
        const scaleCompensation = Math.min(0.1, worldScale * 0.02); // Máximo 10% compensación
        
        // Reducir impacto de variabilidad para mundos grandes
        const adjustedVariation = variability * (0.3 - scaleCompensation);
        
        return Math.max(0.75, BASE_BUILDING_DENSITY - adjustedVariation + scaleCompensation);
    }

    function selectWeightedRandom(weightedArray) {
        const totalWeight = weightedArray.reduce((sum, item) => sum + Math.max(item.adjustedWeight || item.weight, 0.01), 0);
        let random = Math.random() * totalWeight;
    
        for (const item of weightedArray) {
            const weight = Math.max(item.adjustedWeight || item.weight, 0.01);
            if (random < weight) {
                return item.type;
            }
            random -= weight;
        }
        return weightedArray[0].type; // Fallback
    }

    // Tipo de edificio basado en morphology y altura
    function selectBuildingType(height, isPerimeter) {
        const variability = (morphology - 1) / 9; // Normalizar morphology
    
        // Con más morphology, más probabilidad de tipos alternativos
        const typeWeights = buildingTypes.map((bt) => ({
            ...bt,
            adjustedWeight:
                bt.type === "box"
                    ? bt.weight - variability * 0.4 // Reducir cajas
                    : bt.weight + variability * (bt.weight * 2), // Aumentar otros tipos
        }));
    
        // Los edificios con twist solo aparecen si son altos y hay suficiente variabilidad
        if (height < buildingHeight * 0.7 || variability < 0.3) {
            // Filtrar twisted para edificios bajos o poca variabilidad
            const filteredTypes = typeWeights.filter((bt) => bt.type !== "twisted");
            return selectWeightedRandom(filteredTypes);
        }
    
        return selectWeightedRandom(typeWeights);
    }

    function preGenerateBuildingHeights(cols, rows) {
        buildingHeights = Array(cols).fill().map(() => 
            Array(rows).fill().map(() => {
                const minHeight = MIN_PROPERTY_HEIGHT;
                const maxHeight = buildingHeight;
                return Math.random() * (maxHeight - minHeight) + minHeight;
            })
        );
        return buildingHeights;
    }
    
    function getNeighborInfo(gridX, gridZ, cols, rows) {
        // Verificación robusta de límites y existencia de datos
        if (!buildingHeights || gridX < 0 || gridX >= cols || gridZ < 0 || gridZ >= rows) {
            return { height: 0, exists: false, reason: 'out_of_bounds' };
        }
        
        // Verificar que la fila existe
        if (!buildingHeights[gridX]) {
            return { height: 0, exists: false, reason: 'no_row_data' };
        }
        
        // Verificar que el valor existe y es un número
        const height = buildingHeights[gridX][gridZ];
        
        // CLAVE: Distinguir entre "lote vacío" (altura = 0) y "sin datos"
        if (typeof height !== 'number' || isNaN(height)) {
            return { height: 0, exists: false, reason: 'invalid_data' };
        }
        
        if (height === 0) {
            return { height: 0, exists: false, reason: 'empty_lot' };
        }
        
        return { 
            height: height, 
            exists: true, 
            reason: 'building_exists' 
        };
    }
    
    // Función mejorada para crear geometría según tipo (incluyendo twist)
    function createPropertyGeometry(type, width, height, depth) {
        switch (type) {
            case "pyramid":
                return new THREE.ConeGeometry(Math.min(width, depth) / 2, height, 3);
            case "cylinder":
                return new THREE.CylinderGeometry(Math.min(width, depth) / 2, Math.min(width, depth) / 2, height, 8);
            
            case "twisted":
                // Crear geometría de caja y aplicar twist
                const geometry = new THREE.BoxGeometry(width, height, depth, 1, 4, 1);
                const vertices = geometry.attributes.position.array;
    
                // Aplicar twist basado en altura
                for (let i = 0; i < vertices.length; i += 3) {
                    const y = vertices[i + 1];
                    const yNorm = (y + height / 2) / height; // Normalizar Y de 0 a 1
                    const angle = yNorm * Math.PI; // Twist de 180 grados máximo
    
                    const x = vertices[i];
                    const z = vertices[i + 2];
    
                    vertices[i] = x * Math.cos(angle) - z * Math.sin(angle);
                    vertices[i + 2] = x * Math.sin(angle) + z * Math.cos(angle);
                }
    
                geometry.attributes.position.needsUpdate = true;
                geometry.computeVertexNormals();
                return geometry;
            case "box":
            default:
                return new THREE.BoxGeometry(width, height, depth);
        }
    }
    
    function createWindowsAndDoors(group, width, depth, height, floors, exposedFaces) {
        const firstVisibleFloor = (neighborHeight) => Math.floor(neighborHeight / floorHeight);
        
        const faceConfigs = [
            { 
                name: 'front', 
                pos: [0, 0, depth/2], 
                rot: [0, 0, 0], 
                doorDir: [0, 0, 1],
                faceWidth: width,  // Ancho real de esta fachada
                isVertical: false
            },
            { 
                name: 'back', 
                pos: [0, 0, -depth/2], 
                rot: [0, Math.PI, 0], 
                doorDir: [0, 0, -1],
                faceWidth: width,  // Ancho real de esta fachada
                isVertical: false
            },
            { 
                name: 'right', 
                pos: [width/2, 0, 0], 
                rot: [0, Math.PI/2, 0], 
                doorDir: [1, 0, 0],
                faceWidth: depth,  // Ancho real de esta fachada
                isVertical: true
            },
            { 
                name: 'left', 
                pos: [-width/2, 0, 0], 
                rot: [0, -Math.PI/2, 0], 
                doorDir: [-1, 0, 0],
                faceWidth: depth,  // Ancho real de esta fachada
                isVertical: true
            }
        ];
        
        faceConfigs.forEach(({ name, pos, doorDir, faceWidth, isVertical }) => {
            if (!exposedFaces[name] || !exposedFaces[name].exposed) return;
            
            // Calcular ventanas basado en el ancho real de cada fachada
            const numWindows = Math.max(1, Math.floor(faceWidth / 2.5)); // Ventanas cada 2.5m
            let doorCreated = false;
            
            for (let floor = 0; floor < floors; floor++) {
                const minVisibleFloor = Math.max(0, firstVisibleFloor(exposedFaces[name].neighborHeight || 0) - 1);
                if (floor < minVisibleFloor) continue;
                
                const y = (floor + 0.5) * floorHeight;
                const isGroundFloor = floor === 0;
                
                for (let i = 0; i < numWindows; i++) {
                    // Distribución proporcional al ancho real de la fachada
                    const offset = (i - (numWindows - 1) / 2) * (faceWidth / numWindows);
                    
                    const shouldCreateDoor = isGroundFloor && 
                                           !doorCreated && 
                                           Math.random() < 0.8;
                    
                    if (shouldCreateDoor) {
                        createDoor(group, pos, offset, doorDir, name, isVertical);
                        doorCreated = true;
                    } else {
                        createWindow(group, pos, offset, y, name, isVertical);
                    }
                }
            }
        });
    }
    
    function createWindow(group, facePos, offset, y, faceName, isVertical) {
        const windowSize = 0.6;
        const windowGeom = isVertical ? 
            new THREE.BoxGeometry(0.1, windowSize, windowSize) : 
            new THREE.BoxGeometry(windowSize, windowSize, 0.1);
        
        const window = new THREE.Mesh(windowGeom, detailMaterials.window);
        const frame = new THREE.Mesh(
            isVertical ? 
                new THREE.BoxGeometry(0.05, windowSize + 0.1, windowSize + 0.1) : 
                new THREE.BoxGeometry(windowSize + 0.1, windowSize + 0.1, 0.05),
            detailMaterials.frame
        );
        
        if (isVertical) {
            window.position.set(facePos[0] + Math.sign(facePos[0]) * 0.05, y, facePos[2] + offset);
            frame.position.copy(window.position);
        } else {
            window.position.set(facePos[0] + offset, y, facePos[2] + Math.sign(facePos[2]) * 0.05);
            frame.position.copy(window.position);
        }
        
        group.add(window, frame);
    }
    
    function createDoor(group, facePos, offset, doorDir, faceName, isVertical) {
        const doorGeom = isVertical ? 
            new THREE.BoxGeometry(0.1, 1.8, 0.8) : 
            new THREE.BoxGeometry(0.8, 1.8, 0.1);
        
        const door = new THREE.Mesh(doorGeom, detailMaterials.door);
        const frame = new THREE.Mesh(
            isVertical ? 
                new THREE.BoxGeometry(0.05, 1.9, 0.9) : 
                new THREE.BoxGeometry(0.9, 1.9, 0.05),
            detailMaterials.frame
        );
        const step = new THREE.Mesh(
            isVertical ? 
                new THREE.BoxGeometry(0.6, 0.15, 1.2) : 
                new THREE.BoxGeometry(1.2, 0.15, 0.6),
            detailMaterials.step
        );
        
        if (isVertical) {
            door.position.set(facePos[0] + Math.sign(facePos[0]) * 0.05, 0.9, facePos[2] + offset);
            step.position.set(facePos[0] + doorDir[0] * 0.3, 0.075, facePos[2] + offset);
        } else {
            door.position.set(facePos[0] + offset, 0.9, facePos[2] + Math.sign(facePos[2]) * 0.05);
            step.position.set(facePos[0] + offset, 0.075, facePos[2] + doorDir[2] * 0.3);
        }
        
        frame.position.copy(door.position);
        group.add(door, frame, step);
    }
    
    // Función mejorada para crear balcones CON MUROS LATERALES
    function createBalconies(group, width, depth, height, floors, exposedFaces) {
        const firstVisibleFloor = (neighborHeight) => Math.floor(neighborHeight / floorHeight);
        
        const balconyConfigs = [
            { name: 'front', pos: [0, 0, depth/2], dir: [0, 0, 1], balconyWidth: width * 0.6 },
            { name: 'back', pos: [0, 0, -depth/2], dir: [0, 0, -1], balconyWidth: width * 0.6 },
            { name: 'right', pos: [width/2, 0, 0], dir: [1, 0, 0], balconyWidth: depth * 0.6 },
            { name: 'left', pos: [-width/2, 0, 0], dir: [-1, 0, 0], balconyWidth: depth * 0.6 }
        ];
        
        for (let floor = 1; floor < floors - 1; floor++) {
            if (Math.random() > 0.4) continue;
            
            const y = floor * floorHeight;
            
            balconyConfigs.forEach(({ name, pos, dir, balconyWidth }) => {
                if (!exposedFaces[name] || !exposedFaces[name].exposed) return;
                if (floor <= firstVisibleFloor(exposedFaces[name].neighborHeight || 0)) return;
                
                // Código de createSingleBalcony integrado aquí
                const balconyDepth = 1.0;
                const isVertical = name === 'left' || name === 'right';
                
                // Crear todas las geometrías
                const platformGeom = isVertical ? 
                    new THREE.BoxGeometry(balconyDepth, 0.15, balconyWidth) : 
                    new THREE.BoxGeometry(balconyWidth, 0.15, balconyDepth);
                
                const frontRailingGeom = isVertical ? 
                    new THREE.BoxGeometry(0.1, 0.8, balconyWidth) : 
                    new THREE.BoxGeometry(balconyWidth, 0.8, 0.1);
                
                const sideRailingGeom = isVertical ? 
                    new THREE.BoxGeometry(balconyDepth, 0.8, 0.1) : 
                    new THREE.BoxGeometry(0.1, 0.8, balconyDepth);
                
                // Crear meshes
                const platform = new THREE.Mesh(platformGeom, detailMaterials.balcony);
                const frontRailing = new THREE.Mesh(frontRailingGeom, detailMaterials.balcony);
                const sideRailing1 = new THREE.Mesh(sideRailingGeom, detailMaterials.balcony);
                const sideRailing2 = sideRailing1.clone();
                
                // Posicionar elementos
                if (isVertical) {
                    platform.position.set(pos[0] + dir[0] * balconyDepth/2, y, pos[2]);
                    frontRailing.position.set(pos[0] + dir[0] * (balconyDepth - 0.05), y + 0.5, pos[2]);
                    sideRailing1.position.set(pos[0] + dir[0] * balconyDepth/2, y + 0.5, pos[2] - balconyWidth/2 + 0.05);
                    sideRailing2.position.set(pos[0] + dir[0] * balconyDepth/2, y + 0.5, pos[2] + balconyWidth/2 - 0.05);
                } else {
                    platform.position.set(pos[0], y, pos[2] + dir[2] * balconyDepth/2);
                    frontRailing.position.set(pos[0], y + 0.5, pos[2] + dir[2] * (balconyDepth - 0.05));
                    sideRailing1.position.set(pos[0] - balconyWidth/2 + 0.05, y + 0.5, pos[2] + dir[2] * balconyDepth/2);
                    sideRailing2.position.set(pos[0] + balconyWidth/2 - 0.05, y + 0.5, pos[2] + dir[2] * balconyDepth/2);
                }
                
                group.add(platform, frontRailing, sideRailing1, sideRailing2);
            });
        }
    }
    
    function createCornice(group, width, depth, height) {
        const corniceHeight = 0.6;
        const corniceExtension = 0.4;
        const molding1Extension = 0.2;
        const molding2Extension = 0.3;
        
        // Cornisa base rectangular
        const baseCornice = new THREE.Mesh(
            new THREE.BoxGeometry(
                width + corniceExtension * 2, 
                corniceHeight, 
                depth + corniceExtension * 2
            ),
            detailMaterials.cornice
        );
        baseCornice.position.set(0, height + corniceHeight/2, 0);
        group.add(baseCornice);
        
        // Primera moldura rectangular
        const molding1 = new THREE.Mesh(
            new THREE.BoxGeometry(
                width + molding2Extension * 2, 
                0.15, 
                depth + molding2Extension * 2
            ),
            detailMaterials.cornice
        );
        molding1.position.set(0, height + corniceHeight + 0.075, 0);
        group.add(molding1);
        
        // Segunda moldura rectangular
        const molding2 = new THREE.Mesh(
            new THREE.BoxGeometry(
                width + molding1Extension * 2, 
                0.1, 
                depth + molding1Extension * 2
            ),
            detailMaterials.cornice
        );
        molding2.position.set(0, height + corniceHeight + 0.2, 0);
        group.add(molding2);
        
        // Dentículos distribuidos proporcionalmente
        const detailHeight = 0.3;
        const detailWidth = 0.2;
        
        // Fachadas frontal y trasera (ancho = width)
        const frontBackDenticles = Math.max(3, Math.floor(width / 3));
        for (let side = 0; side < 2; side++) {
            const z = (side === 0 ? 1 : -1) * (depth/2 + corniceExtension + 0.05);
            
            for (let i = 0; i < frontBackDenticles; i++) {
                const x = (i - (frontBackDenticles - 1) / 2) * (width / frontBackDenticles);
                
                const denticle = new THREE.Mesh(
                    new THREE.BoxGeometry(detailWidth, detailHeight, 0.15),
                    detailMaterials.cornice
                );
                denticle.position.set(x, height + corniceHeight/2, z);
                group.add(denticle);
                
                const support = new THREE.Mesh(
                    new THREE.BoxGeometry(detailWidth * 0.8, 0.15, 0.2),
                    detailMaterials.cornice
                );
                support.position.set(x, height + 0.1, z);
                group.add(support);
            }
        }
        
        // Fachadas laterales (ancho = depth)
        const leftRightDenticles = Math.max(3, Math.floor(depth / 3));
        for (let side = 0; side < 2; side++) {
            const x = (side === 0 ? -1 : 1) * (width/2 + corniceExtension + 0.05);
            
            for (let i = 0; i < leftRightDenticles; i++) {
                const z = (i - (leftRightDenticles - 1) / 2) * (depth / leftRightDenticles);
                
                const denticle = new THREE.Mesh(
                    new THREE.BoxGeometry(0.15, detailHeight, detailWidth),
                    detailMaterials.cornice
                );
                denticle.position.set(x, height + corniceHeight/2, z);
                group.add(denticle);
                
                const support = new THREE.Mesh(
                    new THREE.BoxGeometry(0.2, 0.15, detailWidth * 0.8),
                    detailMaterials.cornice
                );
                support.position.set(x, height + 0.1, z);
                group.add(support);
            }
        }
        
        // Elementos decorativos en las esquinas (4 esquinas para rectángulo)
        const cornerPositions = [
            [width/2 + corniceExtension - 0.1, height + corniceHeight + 0.15, depth/2 + corniceExtension - 0.1],
            [-width/2 - corniceExtension + 0.1, height + corniceHeight + 0.15, depth/2 + corniceExtension - 0.1],
            [width/2 + corniceExtension - 0.1, height + corniceHeight + 0.15, -depth/2 - corniceExtension + 0.1],
            [-width/2 - corniceExtension + 0.1, height + corniceHeight + 0.15, -depth/2 - corniceExtension + 0.1]
        ];
        
        cornerPositions.forEach(([x, y, z]) => {
            const cornerDetail = new THREE.Mesh(
                new THREE.BoxGeometry(0.25, 0.2, 0.25),
                detailMaterials.cornice
            );
            cornerDetail.position.set(x, y, z);
            group.add(cornerDetail);
            
            const cornerBase = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.1, 0.3),
                detailMaterials.cornice
            );
            cornerBase.position.set(x, y - 0.15, z);
            group.add(cornerBase);
        });
        
        // Friso rectangular
        const frieze = new THREE.Mesh(
            new THREE.BoxGeometry(width + 0.1, 0.4, depth + 0.1),
            new THREE.MeshLambertMaterial({ color: 0x999999 })
        );
        frieze.position.set(0, height - 0.5, 0);
        group.add(frieze);
    }
    
    function createFloorDivisions(group, width, depth, height, floors, exposedFaces) {
        const divisionHeight = 0.1;
        const divisionExtension = 0.05;
        
        for (let floor = 1; floor < floors; floor++) {
            const y = floor * floorHeight;
            
            Object.entries(exposedFaces).forEach(([faceName, faceInfo]) => {
                if (!faceInfo.exposed) return;
                
                let division;
                switch (faceName) {
                    case 'front':
                        division = new THREE.Mesh(
                            new THREE.BoxGeometry(width, divisionHeight, divisionExtension),
                            detailMaterials.floorDivision
                        );
                        division.position.set(0, y, depth/2 + divisionExtension/2);
                        break;
                    case 'back':
                        division = new THREE.Mesh(
                            new THREE.BoxGeometry(width, divisionHeight, divisionExtension),
                            detailMaterials.floorDivision
                        );
                        division.position.set(0, y, -depth/2 - divisionExtension/2);
                        break;
                    case 'right':
                        division = new THREE.Mesh(
                            new THREE.BoxGeometry(divisionExtension, divisionHeight, depth),
                            detailMaterials.floorDivision
                        );
                        division.position.set(width/2 + divisionExtension/2, y, 0);
                        break;
                    case 'left':
                        division = new THREE.Mesh(
                            new THREE.BoxGeometry(divisionExtension, divisionHeight, depth),
                            detailMaterials.floorDivision
                        );
                        division.position.set(-width/2 - divisionExtension/2, y, 0);
                        break;
                }
                if (division) {
                    group.add(division);
                }
            });
        }
    }
    
    function createVisibleStructure(group, width, depth, height, floors, exposedFaces) {
        const beamWidth = 0.3;
        const beamDepth = 0.2;
        
        // COLUMNAS distribuidas según lógica proporcional a fachada
        const columns = [];
    
        // Número de columnas basado en la misma lógica que ventanas
        const columnsAlongWidth = Math.max(1, Math.floor(width / 2.5)) + 1;
        const columnsAlongDepth = Math.max(1, Math.floor(depth / 2.5)) + 1;
    
        for (let i = 0; i < columnsAlongWidth; i++) {
            for (let j = 0; j < columnsAlongDepth; j++) {
                // Solo columnas en perímetro si hay cara expuesta adyacente
                const isPerimeter = i === 0 || i === columnsAlongWidth - 1 || j === 0 || j === columnsAlongDepth - 1;
                if (!isPerimeter) continue; // Solo columnas perimetrales por ahora
                
                const x = (i - (columnsAlongWidth - 1) / 2) * (width / (columnsAlongWidth - 1));
                const z = (j - (columnsAlongDepth - 1) / 2) * (depth / (columnsAlongDepth - 1));
                
                // Verificar si hay cara expuesta adyacente
                const hasExposedFace = 
                    (i === 0 && exposedFaces.left?.exposed) ||
                    (i === columnsAlongWidth - 1 && exposedFaces.right?.exposed) ||
                    (j === 0 && exposedFaces.back?.exposed) ||
                    (j === columnsAlongDepth - 1 && exposedFaces.front?.exposed);
                
                if (hasExposedFace) {
                    const column = new THREE.Mesh(
                        new THREE.BoxGeometry(beamWidth, height, beamWidth),
                        detailMaterials.concrete
                    );
                    column.position.set(x, height/2, z);
                    columns.push(column);
                }
            }
        }
        group.add(...columns);
    
        // VIGAS horizontales rectangulares
        for (let floor = 1; floor <= floors; floor++) {
            const y = floor * floorHeight;
            
            Object.entries(exposedFaces).forEach(([faceName, faceInfo]) => {
                if (!faceInfo || !faceInfo.exposed) return;
                
                let beam;
                switch (faceName) {
                    case 'front':
                    case 'back':
                        beam = new THREE.Mesh(
                            new THREE.BoxGeometry(width, beamDepth, beamWidth),
                            detailMaterials.steel
                        );
                        beam.position.set(0, y, faceName === 'front' ? depth/2 : -depth/2);
                        break;
                    case 'right':
                    case 'left':
                        beam = new THREE.Mesh(
                            new THREE.BoxGeometry(beamWidth, beamDepth, depth),
                            detailMaterials.steel
                        );
                        beam.position.set(faceName === 'right' ? width/2 : -width/2, y, 0);
                        break;
                }
                if (beam) {
                    group.add(beam);
                }
            });
        }
    }
    
    function createRooftopWall(group, width, depth, height) {
        const wallHeight = 0.8;
        
        const walls = [
            new THREE.Mesh(new THREE.BoxGeometry(width, wallHeight, 0.15), detailMaterials.wall),  // Frontal
            new THREE.Mesh(new THREE.BoxGeometry(width, wallHeight, 0.15), detailMaterials.wall),  // Trasera
            new THREE.Mesh(new THREE.BoxGeometry(0.15, wallHeight, depth), detailMaterials.wall),  // Izquierda
            new THREE.Mesh(new THREE.BoxGeometry(0.15, wallHeight, depth), detailMaterials.wall)   // Derecha
        ];
        
        walls[0].position.set(0, height + wallHeight/2, depth/2);   // Frontal
        walls[1].position.set(0, height + wallHeight/2, -depth/2);  // Trasera
        walls[2].position.set(-width/2, height + wallHeight/2, 0);  // Izquierda
        walls[3].position.set(width/2, height + wallHeight/2, 0);   // Derecha
        
        walls.forEach(wall => group.add(wall));

    function createRooftopStructures(group, width, depth, height) {
        if (Math.random() > 0.6) return;
        
        // Calcular área del edificio y dimensión mínima
        const buildingArea = width * depth;

        // DEFINIR TAMAÑOS Y REQUISITOS DE CADA ESTRUCTURA
        const structureTypes = {
            stairHouse: {
                minSize: { width: 3, depth: 3 },
                recommendedSize: { width: 6, depth: 6 },
                create: (group, x, y, z, buildingWidth, buildingDepth) => 
                    createProportionalStairHouse(group, x, y, z, buildingWidth, buildingDepth)
            },
            elevatorTower: {
                minSize: { width: 2.5, depth: 2.5 },
                recommendedSize: { width: 5, depth: 5 },
                create: (group, x, y, z, buildingWidth, buildingDepth) => 
                    createProportionalElevatorTower(group, x, y, z, buildingWidth, buildingDepth)
            },
            attic: {
                minSize: { width: 4, depth: 3.5 },
                recommendedSize: { width: 8, depth: 7 },
                create: (group, x, y, z, buildingWidth, buildingDepth) => 
                    createProportionalAttic(group, x, y, z, buildingWidth, buildingDepth)
            },
            acUnit: {
                minSize: { width: 1.5, depth: 1 },
                recommendedSize: { width: 2, depth: 2 },
                create: (group, x, y, z, buildingWidth, buildingDepth) => 
                    createProportionalACUnit(group, x, y, z, buildingWidth, buildingDepth)
            },
            waterTank: {
                minSize: { width: 2.4, depth: 2.4 }, // Diámetro mínimo
                recommendedSize: { width: 3, depth: 3 },
                create: (group, x, y, z, buildingWidth, buildingDepth) => 
                    createProportionalWaterTank(group, x, y, z, buildingWidth, buildingDepth)
            }
        };
        
        // FILTRAR estructuras que CABEN en el edificio
        const viableStructures = [];
        
        Object.entries(structureTypes).forEach(([name, config]) => {
            const fitsMinimum = width >= config.minSize.width && depth >= config.minSize.depth;
            const fitsRecommended = width >= config.recommendedSize.width && depth >= config.recommendedSize.depth;
            
            if (fitsMinimum) {
                // Más probabilidad si cumple tamaño recomendado
                const probability = fitsRecommended ? 1.0 : 0.4;
                viableStructures.push({
                    name,
                    config,
                    probability,
                    priority: fitsRecommended ? 1 : 2 // 1 = alta prioridad, 2 = baja
                });
            }
        });
        
        if (viableStructures.length === 0) return; // Sin estructuras viables
        
        // DETERMINAR número de estructuras según tamaño del edificio
        let numStructures;
        if (buildingArea < 20) {
            numStructures = 1; // Edificios muy pequeños: máximo 1 estructura
        } else if (buildingArea < 60) {
            numStructures = Math.floor(Math.random() * 2) + 1; // 1-2 estructuras
        } else if (buildingArea < 120) {
            numStructures = Math.floor(Math.random() * 3) + 1; // 1-3 estructuras
        } else {
            numStructures = Math.floor(Math.random() * 4) + 2; // 2-5 estructuras
        }
        
        // SELECCIONAR estructuras con ponderación por prioridad
        const selectedStructures = [];
        const shuffledViable = [...viableStructures].sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < numStructures && i < viableStructures.length; i++) {
            // Preferir estructuras de alta prioridad
            const highPriority = shuffledViable.filter(s => s.priority === 1 && Math.random() < s.probability);
            const lowPriority = shuffledViable.filter(s => s.priority === 2 && Math.random() < s.probability);
            
            const available = highPriority.length > 0 ? highPriority : lowPriority;
            if (available.length === 0) break;
            
            const selected = available[Math.floor(Math.random() * available.length)];
            selectedStructures.push(selected);
            
            // Remover para evitar duplicados
            const index = shuffledViable.indexOf(selected);
            if (index > -1) shuffledViable.splice(index, 1);
        }
        
        // CREAR las estructuras seleccionadas
        selectedStructures.forEach(({ config }) => {
            const xPos = (Math.random() - 0.5) * width * 0.6;
            const zPos = (Math.random() - 0.5) * depth * 0.6;
            const yPos = height;
            
            config.create(group, xPos, yPos, zPos, width, depth);
        });
        
        console.log(`Edificio ${width.toFixed(1)}x${depth.toFixed(1)}m: ${selectedStructures.length} estructuras de azotea`);
    }
    
    function createProportionalStairHouse(group, x, y, z, buildingWidth, buildingDepth) {

        const house = new THREE.Mesh(

    function createProportionalAttic(group, x, y, z, buildingWidth, buildingDepth) {
        // Ático proporcional (máximo 70% de las dimensiones del edificio)
        const atticWidth = Math.max(3, Math.min(buildingWidth * 0.7, 6));
        const atticDepth = Math.max(2.5, Math.min(buildingDepth * 0.7, 4.5));

    function calculateExposedFaces(gridX, gridZ, cols, rows, currentHeight) {
        // Obtener información completa de vecinos (altura + existencia)
        const neighbors = {
            front: getNeighborInfo(gridX, gridZ + 1, cols, rows),
            back: getNeighborInfo(gridX, gridZ - 1, cols, rows),
            left: getNeighborInfo(gridX - 1, gridZ, cols, rows),
            right: getNeighborInfo(gridX + 1, gridZ, cols, rows)
        };
        
        // Umbral para considerar "significativamente más alto"
        // Un edificio debe ser al menos 20% más alto para mostrar detalles en cara compartida
        const HEIGHT_THRESHOLD_RATIO = 1.2;
        
        // Función helper para determinar si una cara está expuesta
        const isFaceExposed = (isAtBorder, neighbor, currentHeight) => {
            // 1. Si está en borde del mundo → siempre expuesto
            if (isAtBorder) {
                return true;
            }
            
            // 2. Si no existe edificio vecino (lote vacío) → expuesto
            if (!neighbor.exists) {
                return true;
            }
            
            // 3. Si existe edificio vecino:
            //    - Si es significativamente más bajo → expuesto (parcial)
            //    - Si es similar altura o más alto → NO expuesto
            const heightRatio = currentHeight / neighbor.height;
            return heightRatio >= HEIGHT_THRESHOLD_RATIO;
        };
        
        // Calcular exposición para cada cara
        const result = {
            front: { 
                exposed: isFaceExposed(
                    gridZ === rows - 1, // ¿Está en borde frontal?
                    neighbors.front, 
                    currentHeight
                ),
                neighborHeight: neighbors.front.height,
                neighborExists: neighbors.front.exists,
                neighborReason: neighbors.front.reason
            },
            back: { 
                exposed: isFaceExposed(
                    gridZ === 0, // ¿Está en borde trasero?
                    neighbors.back, 
                    currentHeight
                ),
                neighborHeight: neighbors.back.height,
                neighborExists: neighbors.back.exists,
                neighborReason: neighbors.back.reason
            },
            left: { 
                exposed: isFaceExposed(
                    gridX === 0, // ¿Está en borde izquierdo?
                    neighbors.left, 
                    currentHeight
                ),
                neighborHeight: neighbors.left.height,
                neighborExists: neighbors.left.exists,
                neighborReason: neighbors.left.reason
            },
            right: { 
                exposed: isFaceExposed(
                    gridX === cols - 1, // ¿Está en borde derecho?
                    neighbors.right, 
                    currentHeight
                ),
                neighborHeight: neighbors.right.height,
                neighborExists: neighbors.right.exists,
                neighborReason: neighbors.right.reason
            }
        };
        
        // Debug opcional: mostrar información de exposición
        if (window.debugExposedFaces) {
            console.log(`🏢 Edificio [${gridX},${gridZ}] altura:${currentHeight.toFixed(1)}m`, {
                front: `${result.front.exposed ? '🔍' : '🚫'} ${neighbors.front.exists ? `edificio(${neighbors.front.height.toFixed(1)}m)` : 'vacío'}`,
                back: `${result.back.exposed ? '🔍' : '🚫'} ${neighbors.back.exists ? `edificio(${neighbors.back.height.toFixed(1)}m)` : 'vacío'}`,
                left: `${result.left.exposed ? '🔍' : '🚫'} ${neighbors.left.exists ? `edificio(${neighbors.left.height.toFixed(1)}m)` : 'vacío'}`,
                right: `${result.right.exposed ? '🔍' : '🚫'} ${neighbors.right.exists ? `edificio(${neighbors.right.height.toFixed(1)}m)` : 'vacío'}`
            });
        }
        
        return result;
    }
    
    function calculateOptimalDivisions(availableSize) {
        const maxDivisions = Math.floor(availableSize / MIN_PROPERTY_SIZE);
        const minDivisions = Math.max(2, Math.floor(maxDivisions * 0.3));
    
        // Seleccionar divisiones aleatorias dentro del rango viable
        return Math.floor(Math.random() * (maxDivisions - minDivisions + 1)) + minDivisions;
    }

    // Función para generar grid de predios en un cuadrante
    function generatePropertiesForQuadrant(quadrantCenterX, quadrantCenterZ) {
        const currentQuadrantSize = (WORLD_BOUNDS - streetWidth) / 2;
        
        // Usar PROPERTY_OFFSET dinámico
        const availableWidth = currentQuadrantSize - PROPERTY_OFFSET * 2;
        const availableDepth = currentQuadrantSize - PROPERTY_OFFSET * 2;
    
        // Calcular divisiones óptimas basadas en MIN_PROPERTY_SIZE dinámico
        const cols = calculateOptimalDivisions(availableWidth);
        const rows = calculateOptimalDivisions(availableDepth);
    
        console.log(`🏗️ Generando grid ${cols}x${rows} en cuadrante (${quadrantCenterX}, ${quadrantCenterZ})
        📐 Offset: ${PROPERTY_OFFSET}, Min Size: ${MIN_PROPERTY_SIZE}`);
    
        const cellWidth = availableWidth / cols;
        const cellDepth = availableDepth / rows;
    
        // Pre-generar todas las alturas antes de crear edificios
        preGenerateBuildingHeights(cols, rows);
    
        // Obtener densidad dinámica basada en morphology
        const baseDensity = getDynamicBuildingDensity();
    
        // Generar grid regular con selección aleatoria basada en ubicación y morphology
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                // Determinar si está en el perímetro
                const isPerimeter = i === 0 || i === cols - 1 || j === 0 || j === rows - 1;
    
                // Probabilidad diferente según ubicación y morphology
                const perimeterFactor = 0.75 + (WORLD_BOUNDS / 200); // Entre 0.75-1.25
                const buildingProbability = isPerimeter
                    ? baseDensity * Math.min(0.9, perimeterFactor)  // Más suave
                    : baseDensity;
    
                // Random: Decidir si construir edificio en esta celda
                if (Math.random() < buildingProbability) {
                    const x = (i - cols / 2 + 0.5) * cellWidth;
                    const z = (j - rows / 2 + 0.5) * cellDepth;
                    
                    // Usar altura pre-generada
                    const preGeneratedHeight = buildingHeights[i][j];
                    
                    // Crear edificio ocupando toda la celda con nueva función
                    createPropertyWithGrid(
                        x, z,
                        cellWidth, cellDepth,
                        quadrantCenterX, quadrantCenterZ,
                        preGeneratedHeight,
                        i, j, cols, rows,
                        isPerimeter
                    );
                } else {
                    // IMPORTANTE: Si no se construye edificio, marcar altura como 0
                    buildingHeights[i][j] = 0;
                    
                }
            }
        }
        
        // ===== 4. CREAR ÁRBOLES Y SEÑALES AL FINAL =====
        const buildingGrid = {
            cols, rows, cellWidth, cellDepth, availableWidth, availableDepth
        };
        
        createTreesAndSignsForQuadrant(
            quadrantCenterX, 
            quadrantCenterZ, 
            currentQuadrantSize, 
            12, // spacing para perímetro
            buildingGrid
        );
    }
    
    function createTrafficLights() {
        // Limpiar semáforos existentes
        clearTrafficLights();
        
        // Solo crear si el offset es mayor a 5
        if (PROPERTY_OFFSET <= 5) return;
        
        // Solo crear semáforos si el mundo es suficientemente grande
        if (WORLD_BOUNDS < 30) return;
        
        const streetHalf = streetWidth / 2;
        
        // Posicionamiento inteligente basado en PROPERTY_OFFSET disponible
        const trafficLightOffset = streetHalf + (PROPERTY_OFFSET * 0.15);
        
        console.log(`🚦 Creando semáforos: offset=${PROPERTY_OFFSET.toFixed(1)}, posición=${trafficLightOffset.toFixed(1)}m de centro`);

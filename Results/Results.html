<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetData Insight | Mapa</title>
    
    <!-- Incluir Mapbox GL JS para estilos vectoriales -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    
    <style>
        /* Estilos previos del navbar y cuerpo se mantienen igual */
        
        /* Nuevos estilos para el mapa */
        #map-container {
            width: 100%;
            height: 60vh;
            margin: 20px 0;
        }
        
        .map {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- Navbar y contenido principal existente -->
    
    <!-- Contenedor del mapa -->
    <div id="map-container">
        <div id="map" class="map"></div>
    </div>

    <!-- Resto de tu contenido existente -->

    <script>
        // Configurar API Key de Geoapify
        const GEOAPIFY_API_KEY = '5cd722885fcb433bb1f934c2a38533b8'; // Regístrate en https://www.geoapify.com/ para obtener tu key
        
        // Cargar estilo personalizado desde GitHub
        fetch('https://raw.githubusercontent.com/EDGARZR54/StreetData-Insight/f3c9f0c1bef3ae5b6ac0d60efc9041420adecf0f/partials/MapStyle.json')
            .then(response => response.json())
            .then(styleJSON => {
                // Modificar fuentes para usar Geoapify
                styleJSON.sources = {
                    "openmaptiles": {
                        "type": "vector",
                        "url": `https://maps.geoapify.com/v1/tile/klokantech-basic/{z}/{x}/{y}.vector.pbf?apiKey=${GEOAPIFY_API_KEY}`
                    }
                };

                // Inicializar mapa con el estilo personalizado
                const map = new mapboxgl.Map({
                    container: 'map',
                    style: styleJSON,
                    center: [-99.1332, 19.4326], // Coordenadas de la CDMX
                    zoom: 12
                });

                // Añadir controles de navegación
                map.addControl(new mapboxgl.NavigationControl());
                
                // Añadir marcador personalizado
                new mapboxgl.Marker({color: '#FF6B6B'})
                    .setLngLat([-99.1332, 19.4326])
                    .setPopup(new mapboxgl.Popup().setHTML('<h3>Punto de interés</h3><p>Ejemplo de marcador</p>'))
                    .addTo(map);
            })
            .catch(error => console.error('Error cargando el estilo:', error));
    </script>
</body>
</html>

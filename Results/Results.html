<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetData Insight | Resultados</title>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/before-after-slider@1.0.0/dist/slider.bundle.js"></script>
    <link rel="icon" type="image/png" href="https://github.com/EDGARZR54/StreetData-Insight/raw/d378384937443e8cd09db8f0956e21d9ce58907d/Grassshopper%20Components/icon/SDI.png">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link href="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/leaflet-gl@latest/leaflet-gl.js"></script>

    <style>
        /* ... (tus estilos CSS) ... */
    </style>
</head>
<body>
    <script>
        // Inicializar el mapa
        const map = L.map('map').setView([18.47668346661841, -69.88745587021114], 15);

        // Cargar el estilo JSON desde tu repositorio
        fetch('https://raw.githubusercontent.com/EDGARZR54/StreetData-Insight/f3c9f0c1bef3ae5b6ac0d60efc9041420adecf0f/partials/MapStyle.json')
            .then(response => response.json())
            .then(style => {
                // Añadir la capa con el estilo personalizado
                L.leafletGl({
                    style: style
                }).addTo(map);

                // Añadir un marcador (sin popup)
                L.marker([18.47668346661841, -69.88745587021114]).addTo(map);
            })
            .catch(error => console.error('Error al cargar el estilo:', error));
    </script>
</body>
</html>

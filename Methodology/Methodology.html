<!DOCTYPE html>
<html>
  <head>
    <title>Street View Coverage Map</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAV-uPYOVaneIuz3vvNJWFwppdFV7KQprg"></script>
    <style>
      #map {
        height: 100vh;  /* Establece el tamaño del mapa a toda la altura de la ventana */
        width: 100%;    /* Establece el mapa para que ocupe todo el ancho disponible */
        margin: 0;
        padding: 0;
      }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      let map;

      // Estilos personalizados
      const customStyles = [
        {
          "featureType": "landscape",
          "stylers": [
            {
              "color": "#ffffff"
            }
          ]
        },
        {
          "featureType": "poi",
          "elementType": "labels",
          "stylers": [
            {
              "visibility": "off"
            }
          ]
        },
        {
          "featureType": "road",
          "elementType": "geometry",
          "stylers": [
            {
              "color": "#fcba00"
            }
          ]
        },
        {
          "featureType": "transit",
          "stylers": [
            {
              "visibility": "off"
            }
          ]
        },
        {
          "featureType": "transit",
          "elementType": "labels",
          "stylers": [
            {
              "visibility": "off"
            }
          ]
        },
        {
          "featureType": "water",
          "stylers": [
            {
              "color": "#4285f4"
            }
          ]
        }
      ];

      // Crear el mapa con los estilos personalizados
      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 0, lng: 0 },  // Centro inicial del mapa (coordenadas del centro del mundo)
          zoom: 2,  // Zoom inicial a nivel mundial
          mapTypeId: "roadmap",
          minZoom: 2,  // Limitar el zoom mínimo al nivel 2
          maxZoom: 13,  // Limitar el zoom máximo al nivel 13
          styles: customStyles,  // Aplicar los estilos personalizados
        });

        // Capa de cobertura de Street View
        const coverageLayer = new google.maps.ImageMapType({
          getTileUrl: function (coord, zoom) {
            return `https://maps.googleapis.com/maps/vt?pb=!1m5!1m4!1i${zoom}!2i${coord.x}!3i${coord.y}!4i256!2m8!1e2!2ssvv!4m2!1scb_client!2sapp!4m2!1scc!2s*211m3*211e3*212b1*213e2*211m3*211e2*212b1*213e2!3m3!3sUS!12m1!1e68!4e0`;
          },
          tileSize: new google.maps.Size(256, 256),
          name: "Cobertura Street View",
          maxZoom: 13  // Limitar el zoom máximo de la capa de cobertura
        });

        map.overlayMapTypes.insertAt(0, coverageLayer);

        // Escuchar cambios en el zoom
        google.maps.event.addListener(map, 'zoom_changed', function() {
          const zoomLevel = map.getZoom();  // Obtener el nivel de zoom actual
          console.log("Nivel de zoom actual:", zoomLevel);  // Imprimir el nivel de zoom en la consola
        });
      }

      // Inicializar el mapa
      window.onload = initMap;
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreetData Insight | AR</title>

  <!-- A-Frame y MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <!-- Estilos y tipografías -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://edgarzr54.github.io/StreetData-Insight/partials/navbar_credits_styles.css" />
  <link rel="icon" type="image/png" href="https://github.com/EDGARZR54/StreetData-Insight/raw/d378384937443e8cd09db8f0956e21d9ce58907d/Grassshopper%20Components/icon/SDI.png">

  <style>
    @font-face {
      font-family: 'Europa-Bold';
      src: url('https://edgarzr54.github.io/StreetData-Insight/partials/fonts/europa-bold-webfont.ttf') format('truetype');
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Open Sans', sans-serif;
      background: transparent;
    }

    #navbar-placeholder {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    #pantalla-bienvenida {
      position: fixed;
      left: 0;
      width: 100%;
      background-color: black;
      color: white;
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    #pantalla-bienvenida h1 {
      font-family: 'Europa-Bold', sans-serif;
      font-size: 2.5rem;
      margin: 0 0 20px 0;
    }

    #pantalla-bienvenida p {
      color: #ccc;
      max-width: 500px;
      margin: 0 auto 20px;
    }

    #pantalla-bienvenida button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #pantalla-bienvenida button:hover {
      background-color: #0056b3;
    }

    a-scene {
      position: fixed;
      left: 0;
      width: 100vw;
      z-index: 500;
    }

    .a-canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .credits {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #333;
      font-size: 12px;
      padding: 15px 10px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 12px;
    }

    .credits img {
      height: 45px;
      margin-bottom: 8px;
    }

    .credits p {
      margin: 0;
      max-width: 600px;
      line-height: 1.4;
      padding: 0 15px;
    }
  </style>
</head>
<body>

  <!-- Navbar externo -->
  <div id="navbar-placeholder"></div>

  <!-- Pantalla de bienvenida -->
  <div id="pantalla-bienvenida">
    <h1>Anexo de Realidad Aumentada</h1>
    <p>Visualiza contenido complementario escaneando imágenes del documento</p>
    <button id="comenzar">Comenzar</button>
  </div>

  <!-- Escena A-Frame + MindAR -->
  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
    id="escena-ar"
    visible="false">

    <a-assets>
      <img id="card" crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" />
      <a-asset-item id="avatarModel" crossorigin="anonymous" src="https://cdn.glitch.me/cf57c429-6f82-4cc2-8387-d3f003bd320b/3EsferaLoop.glb?v=1747065714145"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
      <a-gltf-model
          id="modelo-esfera"
          src="#avatarModel"
          position="0 0 0.1"
          rotation="90 0 0"
          scale="0.005 0.005 0.005"
          animation-mixer>
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <!-- Créditos -->
  <div class="credits">
    <img src="https://raw.githubusercontent.com/EDGARZR54/StreetData-Insight/refs/heads/Street-Data-Insight/Imagotype/UNAM_FA_LATE.svg" alt="UNAM Logo" />
    <p>
      Este proyecto es de carácter académico. Se ha utilizado material visual de Google Street View con fines educativos. Todos los derechos pertenecen a Google. Año: 2025.
    </p>
  </div>

  <!-- Scripts -->
  <script>
    function calculateHeights() {
      const navbar = document.getElementById('navbar-placeholder');
      const credits = document.querySelector('.credits');
      const scene = document.querySelector('a-scene');
      const welcome = document.getElementById('pantalla-bienvenida');
      
      if (!navbar || !credits || !scene || !welcome) return;

      const navbarHeight = navbar.offsetHeight;
      const creditsHeight = credits.offsetHeight;
      const welcomePadding = parseFloat(getComputedStyle(welcome).paddingTop) + 
                           parseFloat(getComputedStyle(welcome).paddingBottom);

      const viewportHeight = window.innerHeight;
      const availableHeight = viewportHeight - navbarHeight - creditsHeight - welcomePadding;

      // Aplicar alturas
      scene.style.height = `${availableHeight}px`;
      scene.style.top = `${navbarHeight}px`;
      
      welcome.style.height = `${availableHeight}px`;
      welcome.style.top = `${navbarHeight}px`;
    }

    // Control de redimensionamiento
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(calculateHeights, 150);
    });

    // Cargar navbar y configurar
    fetch('https://edgarzr54.github.io/StreetData-Insight/partials/navbar.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('navbar-placeholder').innerHTML = html;
        
        // Esperar a que se renderice el navbar
        const observer = new MutationObserver(() => {
          calculateHeights();
          observer.disconnect();
        });
        
        observer.observe(document.getElementById('navbar-placeholder'), {
          childList: true,
          subtree: true
        });
      })
      .catch(error => console.error('Error al cargar navbar:', error));

    // Evento de inicio
    document.getElementById("comenzar").addEventListener("click", () => {
      document.getElementById("pantalla-bienvenida").style.display = "none";
      document.querySelector("a-scene").setAttribute("visible", "true");
      calculateHeights();
    });

    // Inicialización final
    window.addEventListener('load', () => {
      calculateHeights();
      setTimeout(calculateHeights, 500); // Doble verificación
    });
  </script>
</body>
</html>
